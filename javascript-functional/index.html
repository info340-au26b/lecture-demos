<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>JavaScript Demo</title>

	<!-- Bootstrap for styling -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">

	<!-- script files (deferred execution) -->
	<script src="js/index.js" defer></script>
</head>
<body class="container-fluid">

	<header class="bg-primary text-white p-2">
		<h1>JavaScript Demo</h1>
	</header>

	<main class="row">
		<section id="puppySection" class="my-3 col-12">
			<h2>A Puppy</h2>
			<div>
				<img src="img/puppy.jpg" alt="a puppy">
			</div>
			<div>
				<button class="btn btn-secondary my-1">Switch</button>
			</div>
		</section>
		
		<section id="songSection" class="my-3 col">
			<h2>Top Songs</h2>
			<ol>
				<!-- will be dynamically generated -->
			</ol>
			<section id="formSection" class="my-3">
				<h3>Add A Song</h3>
				<form>
					<div class="input-group">
						<label for="artistInput" class="input-group-text">Artist</label>
						<input id="artistInput" name="artist" class="form-control">
					</div>
					<div class="input-group">
						<label for="titleInput" class="input-group-text">Title</label>
						<input id="titleInput" name="title" class="form-control">
					</div>
					<div class="input-group">
						<label for="urlInput" class="input-group-text">Youtube Link</label>
						<input id="urlInput" name="youtubeUrl" class="form-control">
					</div>
					<div class="my-2">
						<button type="submit" class="btn btn-primary">Add song</button>
				</form>
			</section>
		</section>

		<!-- <section id="faceSection">
			<img id="face-pic" src="img/happy.png" alt="a face">
		</section> -->
	</main>

</body>
</html>
